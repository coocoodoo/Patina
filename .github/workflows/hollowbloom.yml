name: Hollowbloom

on:
  push:
    branches: [main]
    tags: ["hollowbloom-v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and screenshot tour
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Unit and play-through tests
        run: cargo test -p hollowbloom --release

      - name: Render the screenshot tour (no display needed)
        run: cargo run -p hollowbloom --release -- --shots shots

      - uses: actions/upload-artifact@v4
        with:
          name: hollowbloom-screenshots
          path: shots/*.png

  build:
    name: Build ${{ matrix.target }} (cross-compiled on Linux)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [linux, windows]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu, x86_64-pc-windows-gnu

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install cross toolchains
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64
          python -m pip install ziglang

      - name: Package
        run: hollowbloom/package.sh ${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: hollowbloom-${{ matrix.target }}
          path: dist/*.*

  windows-native:
    name: Build and run on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (MSVC)
        run: cargo build -p hollowbloom --release

      - name: Screenshot tour on Windows
        run: cargo run -p hollowbloom --release -- --shots shots

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/hollowbloom-v')
    needs: [test, build, windows-native]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: hollowbloom-*
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
