[package]
name = "hollowbloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "A cozy top-down action RPG: delve an endless dungeon, farm what you find. Rendered in 3D, limited to the Resurrect 32 palette."
publish = false

[[bin]]
name = "hollowbloom"
path = "src/main.rs"

[dependencies]
winit = "0.30"
softbuffer = "0.4"
glam = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_Media_Audio", "Win32_UI_Input_XboxController"] }
